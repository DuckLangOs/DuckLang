<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckLang OS</title>
  <style>
    body {
      background-color: #c0f0ff;
      color: #000;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    .terminal {
      background: #000;
      color: #0f0;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
      border: 2px solid #0f0;
      border-radius: 8px;
      box-shadow: 0 0 10px #0f0;
    }
    h1 {
      font-size: 2em;
    }
    a {
      color: #007acc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>🦆 DuckLang OS</h1>
  <p><em>A retro coding language for ducks.</em></p>

  <div class="terminal">
<pre>
> RUN hello.duck

SAY Hello Desert
MOVE 100
COLOR 255 255 0
</pre>
  </div>

  <p>
    🐤 Built with Python + love <br>
    📦 <a href="https://github.com/DuckLangOs/DuckLang">View on GitHub</a>
  </p>

  <div class="footer">
    TempleOS but with feathers.<br>
    DuckLang &copy; 2025
  </div>
</body>
</html>
