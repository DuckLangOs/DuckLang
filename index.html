<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DuckLang OS</title>
  <style>
    body {
      background-color: #1b1b1b;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .duck {
      font-size: 60px;
      animation: bounce 1s infinite;
      margin: 30px 0;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .button {
      background-color: #00ffcc;
      color: #1b1b1b;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 20px;
      text-decoration: none;
      display: inline-block;
    }

    .button:hover {
      background-color: #00c0aa;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🦆 DuckLang OS</h1>
  <div class="duck">~(•ᴥ•)~</div>
  <p><i>TempleOS-inspired language and style.</i></p>

  <!-- ✅ Direct download link to GitHub repo ZIP -->
<a href="https://github.com/DuckLangOs/DuckLang/raw/main/DuckLang.zip" class="button" download>
  ⬇️ Download DuckLang
</a>

  <footer>
    Made by DuckLang Dev — 2025
  </footer>
</body>
</html>
